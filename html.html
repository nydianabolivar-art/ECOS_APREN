<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecosistema de aprendizaje · Laboratorio virtual de modelación matemática</title>
<style>
:root{
  --ink:#0f172a; --muted:#5b6b86; --line:#e3e9f4; --bg:#f3f6fc; --card:#fff;
  --indigo:#4f46e5; --indigo2:#3b32c9; --teal:#0d9488; --amber:#f59e0b; --coral:#e11d48; --sky:#0ea5e9;
  --good:#16a34a; --goodbg:#e8f8ee; --bad:#dc2626; --badbg:#fdecec; --warnbg:#fff6e0; --warn:#b45309;
  --r:16px; --shadow:0 6px 24px rgba(30,41,90,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
#app{min-height:100%}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:650;font-size:15px;transition:transform .08s,box-shadow .15s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--indigo),#6d5dfc);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.32)}
.btn.primary:hover{background:linear-gradient(135deg,var(--indigo2),#5b4af0)}
.btn.primary:disabled{background:#c8cfe3;box-shadow:none;cursor:not-allowed}
.btn.soft{background:#eef0ff;color:var(--indigo2)}
.btn.soft:hover{background:#e2e5ff}
.btn.soft:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff}
.btn.mini{padding:5px 10px;font-size:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:9px}
.btn:focus-visible,.opt:focus-visible,.piece:focus-visible,.lvl:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}

/* ---------- HUB ---------- */
.hub-hero{background:radial-gradient(1200px 500px at 85% -10%,#c7d2ff 0,transparent 60%),linear-gradient(180deg,#eaf0ff,#f3f6fc);padding:28px clamp(18px,5vw,64px) 36px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand-name.small{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand-sub{font-size:13px;color:var(--muted)}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:center}
.hub-hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.12;letter-spacing:-.02em;max-width:22ch}
.hub-hero p{margin-top:14px;color:#37466a;max-width:62ch;line-height:1.55;font-size:16px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px;font-size:13px}
.flow span{background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:650;color:#2b3a67}
.flow i{color:#8a97b8;font-style:normal}
.hero-art svg{width:100%;height:auto;max-height:260px;filter:drop-shadow(0 18px 26px rgba(60,70,150,.25))}
.hub-main{padding:8px clamp(18px,5vw,64px) 56px;max-width:1360px;margin:0 auto}
.sec{font-size:20px;letter-spacing:-.01em;margin:30px 0 14px}
.labs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lab{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:2px solid transparent;opacity:.92}
.lab-active{border-color:#a5b4fc;opacity:1}
.lab-art svg{display:block;width:100%;height:auto}
.lab-body{padding:14px 16px 18px}
.lab-n{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo)}
.lab h3{font-size:18px;margin:4px 0 2px;letter-spacing:-.01em}
.lab-course{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.lab p{font-size:14px;line-height:1.45;color:#38476b}
.lab-state{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#eef1f7;color:#64748b}
.lab-state.on{background:#e0e7ff;color:var(--indigo2)}
.missions{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mission-card{display:grid;grid-template-columns:200px 1fr;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;opacity:.8}
.mission-card.ready{opacity:1;border:2px solid #a5b4fc;grid-column:1/-1;grid-template-columns:260px 1fr}
.mc-art svg{display:block;width:100%;height:100%;object-fit:cover}
.mc-body{padding:16px 18px}
.mission-card h3{font-size:19px;letter-spacing:-.01em}
.mc-role{margin-top:4px;color:var(--indigo2);font-weight:700;font-size:14px}
.mc-who{margin-top:3px;color:var(--muted);font-size:13px}
.soon{margin-top:12px;display:inline-block;background:#eef1f7;color:#64748b;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.mc-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.lvl{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"n t" "n s";gap:0 12px;align-items:center;text-align:left;background:#f5f7ff;border:1.5px solid #d7ddff;border-radius:14px;padding:12px 14px;color:var(--ink)}
.lvl b{grid-area:n;width:36px;height:36px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:16px}
.lvl span{grid-area:t;font-weight:750}
.lvl small{grid-area:s;color:var(--muted);font-size:12px}
.lvl:hover:not(:disabled){background:#eceeff;border-color:#a5b4fc}
.lvl.locked{opacity:.55;cursor:not-allowed}
.lvl.locked b{background:#94a3b8}
.lvl.done b{background:var(--good)}
.fineprint{margin-top:16px;font-size:13px;color:var(--muted)}

/* ---------- MISIÓN ---------- */
#app.mission{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.top-title{flex:1;min-width:0}
.top-mission{font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl-chips{display:flex;gap:6px}
.chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#eef1f7;color:#64748b;white-space:nowrap}
.chip.on{background:var(--indigo);color:#fff}
.stage-area{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 500px}
.scene-col{position:relative;min-height:0;background:linear-gradient(#d6e6fb,#e9f1fd)}
#scene{position:absolute;inset:0}
.hud{position:absolute;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:#2b3a67;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
.hud-tl{left:14px;top:14px}
.hud-bl{left:14px;bottom:14px;display:flex;gap:10px;align-items:center}
.panel{background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 40px}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phase{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 4px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#7c8aa8;font-size:11px;font-weight:700;line-height:1.15}
.ph-n{width:24px;height:24px;border-radius:50%;background:#e8ecf5;display:grid;place-items:center;font-size:12px;color:#64748b}
.phase.on{border-color:#a5b4fc;background:#eef0ff;color:var(--indigo2)}
.phase.on .ph-n{background:var(--indigo);color:#fff}
.phase.past .ph-n{background:var(--good);color:#fff}
.bar{height:6px;background:#e3e8f4;border-radius:99px;margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--teal));border-radius:99px;transition:width .4s}
.log{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;font-size:13px}
.log summary{padding:10px 14px;cursor:pointer;font-weight:700;color:#2b3a67}
.log ul{list-style:none;margin:0;padding:4px 14px 12px;display:grid;gap:10px;max-height:240px;overflow:auto}
.log li{display:flex;gap:10px}
.h-ic{font-size:18px}
.h-sum{color:#4a5a7d;margin-top:2px;line-height:1.4}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 20px}
.card-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.card-ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#eef0ff,#dff6f3);display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.card-kicker{font-size:12px;font-weight:750;color:var(--indigo);letter-spacing:.05em;text-transform:uppercase}
.card h2{font-size:21px;letter-spacing:-.01em;line-height:1.2}
.why{display:grid;gap:6px;background:#f6f8ff;border:1px solid #e0e6fb;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;color:#34436a;margin-bottom:14px}
.why b{color:var(--indigo2);margin-right:4px}
.prompt{font-size:16px;line-height:1.55;margin-bottom:14px;color:#1c2748}
.note{font-size:13px;color:var(--muted);margin:8px 0;line-height:1.45}
.note code{background:#eef1f7;padding:1px 6px;border-radius:6px}
.actions{display:flex;gap:10px;margin-top:14px;align-items:center}
.actions.wrap{flex-wrap:wrap}
.brief h4{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo2)}
.brief p,.brief li{line-height:1.55;font-size:15px;color:#1c2748}
.brief ul{margin:0;padding-left:20px;display:grid;gap:5px}
.b-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b-role{background:#f3f6ff;border-radius:12px;padding:9px 11px}
.b-role span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.b-role b{font-size:14px}
.decision{margin-top:16px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#fff7e0,#fff0d1);border:1px solid #fcd9a0;font-weight:650;line-height:1.5}
.decision span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);margin-bottom:4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:15px;line-height:1.45;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:#a5b4fc;background:#f7f8ff}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg);opacity:.75}
.opt:disabled{cursor:default}
.dq{margin-bottom:16px}
.dq p{margin-bottom:6px;line-height:1.5}
.bridge{margin-top:10px;padding:13px 15px;border-radius:13px;background:#eefbf8;border:1px solid #bfeee6;line-height:1.5}
.fb{margin-top:10px;padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.fb:empty{display:none}
.fb.ok{background:var(--goodbg);color:#14532d;border:1px solid #bde6cb}
.fb.err{background:var(--badbg);color:#7f1d1d;border:1px solid #f4c4c4}
.fb.warn{background:var(--warnbg);color:#7a3e07;border:1px solid #f8dba0}
.fields{display:grid;gap:10px}
.fld{display:block}
.fld span{display:block;font-size:13px;font-weight:700;color:#2b3a67;margin-bottom:5px}
.inwrap{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.inwrap input{border:0;outline:0;flex:1;min-width:0;padding:12px 0;font-size:16px;background:transparent;font-variant-numeric:tabular-nums}
.inwrap em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.inwrap.small{width:110px;flex:0 0 auto}
.inwrap:focus-within{border-color:var(--indigo)}
.fres{margin:-4px 0 4px}
.fres .fb{margin-top:6px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;line-height:1.5;resize:vertical;background:#fff}
textarea:focus{border-color:var(--indigo);outline:0}
.count{font-size:12px;color:var(--muted);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;font-variant-numeric:tabular-nums}
.tbl th{background:#f1f4fb;text-align:left;padding:7px 9px;font-weight:700;color:#34436a;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 9px;border-bottom:1px solid #eef1f7}
.tool{border:1.5px dashed #b9c3f5;border-radius:14px;padding:10px 12px;margin:10px 0 12px;background:#fafbff}
.tool-h{font-weight:750;font-size:14px;color:var(--indigo2)}
.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.piece{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i b" "i s";text-align:left;gap:0 12px;align-items:center;padding:12px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.piece .pi{grid-area:i;font-size:28px}
.piece b{grid-area:b;font-size:14px}
.piece small{grid-area:s;color:var(--muted);font-size:12px}
.piece.sel{border-color:var(--indigo);background:#eef0ff;box-shadow:0 0 0 3px #dfe3ff}
.cstat{display:grid;gap:6px;margin:12px 0}
.cat-row{display:flex;justify-content:space-between;padding:8px 12px;background:#f5f7fc;border-radius:10px;font-size:14px}
.cat-row.okrow{background:var(--goodbg);color:#14532d}
.cat-row.over{background:var(--badbg);color:#7f1d1d}
.hintbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.hint{margin-top:8px;padding:10px 12px;background:#fffbea;border:1px solid #fde9a6;border-radius:12px;font-size:14px;line-height:1.45}
.hint span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#a16207;margin-bottom:3px}
.ctrl label{font-size:13px;font-weight:700;color:#2b3a67}
.sl{display:flex;gap:12px;align-items:center;margin-top:6px}
.sl input[type=range]{flex:1;accent-color:var(--indigo);height:30px}
.chk{font-size:13px;color:#2b3a67;display:flex;gap:6px;align-items:center}
.scen{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.radio{background:#f3f6ff;border:1.5px solid #d7ddff;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:650;display:flex;gap:6px;align-items:center}
.chart{width:100%;height:250px;display:block;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.contrast{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.contrast>div{background:#f3f6ff;border-radius:12px;padding:11px 13px}
.contrast span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.contrast b{font-size:18px}
.contrast small{display:block;color:#4a5a7d}
.sentence{line-height:2.4;font-size:15px;background:#fafbff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sentence select{font:inherit;font-size:14px;margin:0 3px;padding:6px 8px;border-radius:9px;border:1.5px solid #b9c3f5;background:#fff;color:var(--ink);max-width:100%}
.sentence select.good{border-color:var(--good);background:var(--goodbg)}
.sentence select.bad{border-color:var(--bad);background:var(--badbg)}

@media (max-width:1000px){
  .hero-grid{grid-template-columns:1fr}.hero-art{display:none}
  .labs{grid-template-columns:repeat(2,1fr)}
  .missions{grid-template-columns:1fr}.mission-card.ready{grid-template-columns:1fr}
  .mc-levels{grid-template-columns:1fr}
  #app.mission{height:auto;min-height:100vh;overflow:auto}
  .stage-area{grid-template-columns:1fr;grid-template-rows:56vh auto}
  .scene-col{height:56vh}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .lvl-chips{display:none}
}
@media (max-width:560px){.labs{grid-template-columns:1fr}.catalog{grid-template-columns:1fr}.b-top{grid-template-columns:1fr}.phase .ph-t{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>

as.",info:["Demanda: 12.000 unidades al a\xF1o, constante (1.000 por mes).","Cada pedido cuesta 240 mil pesos (transporte, tr\xE1mite y recepci\xF3n), sin importar su tama\xF1o.","Almacenar una unidad cuesta 4 mil pesos al a\xF1o (espacio, seguro y capital inmovilizado).","Los pedidos llegan completos y el inventario baja de forma pareja hasta cero antes del siguiente pedido."],restrictions:["La bodega tiene 6 m\xF3dulos de estanter\xEDa: caben 1.500 unidades.","Cifras en miles de pesos y simuladas con fines formativos."],decision:"\xBFDe cu\xE1ntas unidades debe ser cada pedido para que el costo anual de abastecer sea el menor posible?"}),{...lh,questions:[{q:"Si Altiplano hace pedidos m\xE1s grandes y menos frecuentes, \xBFqu\xE9 pasa con el costo anual de pedir?",opts:[lt("Disminuye","Correcto: menos pedidos al a\xF1o significa pagar menos veces el transporte y el tr\xE1mite."),Pe("Aumenta","Piensa en cu\xE1ntos pedidos se hacen al a\xF1o: son menos."),Pe("No cambia","Cada pedido tiene un costo fijo, as\xED que depende de cu\xE1ntos se hagan.")]},{q:"Y con pedidos m\xE1s grandes, \xBFqu\xE9 pasa con el costo anual de almacenar?",opts:[lt("Aumenta","Correcto: se guarda m\xE1s mercanc\xEDa, durante m\xE1s tiempo."),Pe("Disminuye","M\xE1s unidades en bodega cuestan m\xE1s espacio, seguro y capital."),Pe("No cambia","El inventario promedio depende del tama\xF1o del pedido.")]},{q:"La derivada de una funci\xF3n de costo C(Q) en un punto indica\u2026",opts:[lt("Cu\xE1nto cambia el costo por cada unidad adicional de Q, cerca de ese punto","Correcto: es una tasa de cambio, con unidades de costo por unidad."),Pe("El costo total en ese punto","Eso lo da C(Q). La derivada mide c\xF3mo cambia C."),Pe("El valor m\xE1ximo que alcanza el costo","Los m\xE1ximos y m\xEDnimos se buscan con la derivada, pero ella no es ese valor.")]}],bridge:"Dos fuerzas se oponen: pedir poco sube el costo de pedir; pedir mucho sube el costo de almacenar. En esta misi\xF3n encontrar\xE1s el punto d ("Se duplica.","La relaci\xF3n no es lineal: Q* depende de \u221AS."),Pe("No cambia.","Q* depende de S."),Pe("Se reduce a la mitad.","Con pedidos m\xE1s caros conviene pedir m\xE1s, no menos.")]},{type:"report",phase:4,title:"Informe a la gerencia",icon:"\u{1F4C4}",ped:"Comunicar la decisi\xF3n es parte del trabajo profesional.",mat:"S\xEDntesis del modelo, la decisi\xF3n y su justificaci\xF3n."}]}}function px(){let t=gn(),e=1e3,n=t.C(e),s=t.C(t.qStar())+150,r=gn({H:5});return{id:2,name:"Intermedio",tag:"Elecci\xF3n con pistas",summary:"La bodega actual limita el pedido. Eval\xFAas si conviene alquilar espacio extra.",P:{},stages:[oh({situation:"Altiplano ya conoce el tama\xF1o de pedido ideal en teor\xEDa, pero la bodega actual tiene solo 4 m\xF3dulos de estanter\xEDa. Gerencia debe decidir si trabaja con la bodega que tiene o si alquila espacio adicional.",info:["Mismos datos de demanda y costos: D = 12.000 u/a\xF1o, S = 240, H = 4.","Cada m\xF3dulo de estanter\xEDa almacena 250 unidades.","Alquilar 2 m\xF3dulos adicionales (500 unidades m\xE1s) cuesta 150 mil pesos al a\xF1o."],restrictions:["El pedido no puede superar la capacidad instalada.","Cifras en miles de pesos y simuladas con fines formativos."],decision:"\xBFQu\xE9 tama\xF1o de pedido conviene usar y vale la pena alquilar el espacio adicional?"}),{...lh,questions:[{q:"Si una funci\xF3n de costo es decreciente en todo el intervalo permitido [0, b], \xBFd\xF3nde est\xE1 su m\xEDnimo en ese intervalo?",opts:[lt("En el extremo derecho, x = b","Correcto: al ser decreciente, el menor valor est\xE1 en el extremo derecho."),Pe("Donde la derivada vale 0","Si la derivada no se anula dentro del intervalo, no hay punto cr\xEDtico interior."),Pe("En el extremo izquierdo, x = 0","Decreciente significa que baja hacia la derecha.")]},{q:"Un costo fijo adicional (como un alquiler) que no depende de Q, \xBFqu\xE9 efecto tiene en la derivada del costo?",opts:[lt("Ninguno: la derivada de una constante es 0","Correcto, pero s\xED cambia el costo total que comparar\xE1s entre alternativas."),Pe("La aumenta en ese valor","Una constante no cambia la pendiente."),Pe("La anula","No anula la derivada del resto.")]},{q:"Para decidir entre dos alternativas con restricciones distintas, \xBFqu\xE9 debes comparar?",opts:[lt("El costo total m\xEDnimo alcanzable en cada una","Correcto: cada alternativa tiene su propio \xF3ptimo restringido."),Pe("Solo el pedido \xF3ptimo te\xF3rico","El \xF3ptimo te\xF3rico puede no ser alcanzable."),Pe("Solo cu\xE1l tiene menor alquiler","Falta sumar el efecto sobre el costo de operaci\xF3n.")]}],bridge:"Ahora el \xF3ptimo te\xF3rico puede no ser alcanzable. Tu trabajo es decidir con la restricci\xF3n real y comparar alternativas con cifras."},{type:"build",phase:2,title:"Arma la bodega actual",icon:"\u{1F3D7}\uFE0F",ped:"Representar la restricci\xF3n en el espacio la vuelve visible: la capacidad es un l\xEDmite f\xEDsico.",mat:"Capacidad = m\xF3dulos \xD7 250 unidades.",task:"Coloca 1 muelle de recibo y los 4 m\xF3dulos de estanter\xEDa con los que cuenta hoy la bodega.",need:{anden:1,estanteria:4}},{type:"num",phase:2,title:"Capacidad instalada",icon:"\u{1F4E6}",ped:"Leer la capacidad del montaje f\xEDsico y expresarla como dominio del modelo.",mat:"Dominio de Q: 0 < Q \u2264 capacidad.",prompt:"Con 4 m\xF3dulos de 250 unidades, \xBFcu\xE1l es la capacidad m\xE1xima de un pedido?",fields:[{key:"cap",label:"Capacidad (unidades)",unit:"u",answer:e,tol:.5,fbMap:[[250,.5,"Eso es un solo m\xF3dulo."]]}],hints:["Cuenta los m\xF3dulos que colocaste."]},{type:"expr",phase:2,title:"Modelo y tasa de cambio",icon:"\u{1F9EE}",ped:"Recuperas el modelo del nivel anterior sin que te lo den, para trabajar con \xE9l bajo restricci\xF3n.",mat:"C(Q) = D\xB7S/Q + H\xB7Q/2 y C\u2032(Q) = \u2212D\xB7S/Q\xB2 + H/2.",prompt:"Escribe el costo anual C(Q) y su derivada C\u2032(Q) con los datos de esta misi\xF3n.",fields:[{key:"C",label:"C(Q) =",ref:a=>t.C(a),pts:[200,600,1e3,1800],save:" ra evita recomendar un pedido imposible.",mat:"Si C\u2032 < 0 en todo (0, b], el m\xEDnimo en [0, b] se alcanza en Q = b.",prompt:"El \xF3ptimo te\xF3rico es 1.200, pero la bodega solo recibe 1.000. \xBFQu\xE9 tama\xF1o de pedido recomiendas y por qu\xE9?",opts:[lt("Q = 1.000, porque C\u2032(Q) < 0 en todo (0, 1.000] y el costo sigue bajando hasta el l\xEDmite.","Correcto: el m\xEDnimo restringido est\xE1 en la frontera."),Pe("Q = 1.200, porque es el \xF3ptimo y se puede improvisar espacio.","No es alcanzable con la bodega actual."),Pe("Un valor menor que 1.000 para dejar holgura.","C\u2032 < 0: reducir Q aumenta el costo."),Pe("Q = 600, porque ah\xED C\u2032 es negativa y el costo baja.","All\xED a\xFAn se puede ahorrar m\xE1s aumentando Q.")],hints:["\xBFLa derivada cambia de signo dentro de [0, 1.000]?"]},{type:"num",phase:2,title:"Eval\xFAa dos alternativas",icon:"\u{1F9FE}",ped:"Comparar alternativas con cifras responde a la decisi\xF3n real: \xBFvale la pena el alquiler?",mat:"Alternativa A: Q = 1.000 en la bodega actual. Alternativa B: alquilar espacio (capacidad 1.500), Q = Q* y sumar 150 de alquiler.",prompt:"Calcula el costo anual de cada alternativa (miles de pesos).",fields:[{key:"A",label:"A \xB7 Q = 1.000, sin alquiler",unit:"miles $",answer:n,tol:1,fbMap:[[t.C(t.qStar()),1,"Ese es el m\xEDnimo te\xF3rico, que A no alcanza por la capacidad."]]},{key:"B",label:"B \xB7 Q = Q*, con alquiler de 150",unit:"miles $",answer:s,tol:1,fbMap:[[t.C(t.qStar()),1,"Falta sumar el alquiler de 150 mil pesos al a\xF1o."]]}],hints:["Eval\xFAa C(1.000) y C(Q*).","No olvides el alquiler en B.","C(Q) = 2.880.000/Q + 2\xB7Q."]},{type:"mcq",phase:2,title:"Recomienda una alternativa",icon:"\u{1F3C1}",ped:"La decisi\xF3n final integra el modelo y las consecuencias econ\xF3micas.",mat:"Comparaci\xF3n de costos anuales: A = "+Fe(n)+", B = "+Fe(s)+".",prompt:"\xBFCu\xE1l alternativa recomiendas?",opts:[lt("A: pedir 1.000 con la bodega actual; ahorra "+Fe(s-n)+" mil pesos al a\xF1o frente a alquilar.","Correcto: el ahorro en pedir no compensa el alquiler."),Pe("B: alquilar espacio para alcanzar el \xF3ptimo te\xF3rico.","B cuesta "+Fe(s)+" frente a "+Fe(n)+" de A: es m\xE1s caro."),Pe("Es indiferente.","Hay una diferencia de "+Fe(s-n)+" mil pesos.")]},{type:"predict",phase:3,title:"Predice antes de simular",icon:"\u{1F52E}",ped:"Antes de ver la simulaci\xF3n, te comprometes con un resultado.",mat:"Estimaci\xF3n del pedido recomendado y de su costo anual.",prompt:"Con la bodega actual, \xBFqu\xE9 pedido usar\xE1s y cu\xE1nto costar\xE1 al a\xF1o?",fields:[{key:"Q",label:"Pedido recomendado (unidades)",unit:"u",min:1,max:12e3},{key:"C",label:"Costo anual estimado",unit:"miles $",min:1,max:2e5}]},{type:"sim",phase:3,title:"Simula tu decisi\xF3n",icon:"\u{1F3AC}",ped:"Ver qu\xE9 ocurre al exceder la capacidad hace tangible la restricci\xF3n.",mat:"Contraste entre el pedido pedido, el que cabe y el costo resultante.",prompt:"Ejecuta al menos una simulaci\xF3n con un pedido mayor que la capacidad para ver las consecuencias, y otra con el pedido que recomiendas (en el l\xEDmite de la capacidad).",rule:"cap"},{type:"reflect",phase:3,title:"Explica lo observado",icon:"\u{1F4DD}",ped:"Explicar la consecuencia de exceder la capacidad ayuda a distinguir modelo y realidad.",mat:"Dominio restringido y costo en la frontera.",prompt:"En 2 o 3 frases: \xBFqu\xE9 ocurri\xF3 cuando el pedido super\xF3 la capacidad? \xBFPor qu\xE9 tu pedido recomendado queda justo en el l\xEDmite?",key:"discrepancia",min:40},{type:"sentence",phase:3,title:"Sustenta tu recomendaci\xF3n",icon:"\u{1F9FE}",ped:"Sustentar con criterios matem\xE1ticos la decisi\xF3n sobre capacidad y alquiler.",mat:"Signo de C\u2032, extremo en la frontera, comparaci\xF3n de costos.",prompt:"Completa la recomendaci\xF3n para la gerencia.",parts:["Recomiendo pedir Q = ",{k:"q",opts:[Pe("600","A\xFAn se puede ahorrar aumentando el pedido."),lt("1.000",""),Pe("1.200","No cabe en la bodega actual.")]}," unidades con la bodega actual, porque ",{k:"sign",opts:[lt("C\u2032(Q) < 0 en todo el intervalo (0, 1.000]",""),Pe("C\u2032(Q) = 0 en Q = 1.000","C\u2032(1.000) = \u22120,88: no es cero."),Pe("C\u2032(Q) > 0 en todo el intervalo","Es negativa en todo el intervalo.")]},"; por eso el m\xEDnimo se alcanza en ",{k:"where",opts:[lt("la frontera Q = capacidad",""),Pe("un punto interior donde C\u2032 = 0","Ese punto, Q = 1.200, est\xE1 fuera del dominio.")]},". Alquilar espacio ",{k:"rent",opts:[lt("aumenta el costo anual en "+Fe(s-n)+" mil pesos",""),Pe("reduce el costo anual en "+Fe(s-n)+" mil pesos","El ahorro en pedir (80) no cubre el alquiler (150)."),Pe("no cambia el costo anual","S\xED cambia: se suma el alquiler.")]},", as\xED que no se justifica."]},{type:"mcq",phase:3,title:"Cambia una condici\xF3n",icon:"\u{1F501}",ped:"Comprobar que tu decisi\xF3n resiste un cambio en los costos.",mat:"Con H = 5: Q* = "+Fe(r.qStar(),1)+" > 1.000, la frontera sigue activa.",prompt:"Sube el costo de almacenar de H = 4 a H = 5 (tasa de inter\xE9s mayor). Sin simular: \xBFcambia tu decisi\xF3n (Q y alternativa)?",opts:[lt("No: el nuevo Q* sigue siendo mayor que 1.000, as\xED que la frontera sigue activa y A sigue siendo mejor.","Correcto. Lo verificar\xE1s con cifras en el siguiente paso."),Pe("S\xED: conviene ahora alquilar para llegar al nuevo \xF3ptimo.","El nuevo Q* es \u2248 "+Fe(r.qStar())+", apenas por encima de la capacidad."),Pe("S\xED: conviene reducir el pedido por debajo de 1.000.","Con C\u2032 < 0 en [0, 1.000], reducir Q sube el costo.")]},{type:"num",phase:3,title:"Verifica con cifras",icon:"\u{1F522}",ped:"Confirmar con c\xE1lculo que la decisi\xF3n se mantiene.",mat:"C(1.000) con H = 5.",prompt:"Con H = 5, calcula el costo anual de la alternativa A (Q = 1.000).",fields:[{key:"A",label:"Costo anual A con H = 5",unit:"miles $",answer:r.C(1e3),tol:1,fbMap:[[n,1,"Ese es el costo con H = 4. Cambia H a 5."]]}],hints:["C(1.000) = 2.880.000/1.000 + 5\xB71.000/2."]},{type:"mcq",phase:4,title:"Transferencia a otra situaci\xF3n",icon:"\u{1F331}",ped:"Aplicar el criterio de frontera a un caso nuevo.",mat:"M\xEDnimo restringido en la frontera cuando C\u2032 < 0 en todo el intervalo.",prompt:"Una cadena de ferreter\xEDas calcula un pedido \xF3ptimo de 1.400 unidades, pero su bodega solo recibe 1.000 y C\u2032 < 0 en [0, 1.000]. \xBFQu\xE9 pedido debe usar?",opts:[lt("1.000, el extremo del dominio permitido.","Correcto."),Pe("1.400, ajustando despu\xE9s.","No es alcanzable."),Pe("700, para dejar holgura.","Con C\u2032 < 0, reducir Q aumenta el costo.")]},{type:"report",phase:4,title:"Informe a la gerencia",icon:"\u{1F4C4}",ped:"Comunicar la decisi\xF3n.",mat:"S\xEDntesis del modelo, la restricci\xF3n y la comparaci\xF3n de alternativas."}]}}function fx(){let t=gn(),e=[1e4,12e3,14e3],n=t.Ctot(1200),i=t.Ctot(1500),s=e.map(r=>gn({D:r}).qStar());return{id:3,name:"Avanzado",tag:"Transferencia con menor andamiaje",summary:"Construyes el modelo a partir de facturas, enfrentas demanda incierta y eval\xFAas un descuento por volumen.",P:{},scenarios:e,stages:[oh({situation:"Altiplano cambi\xF3 de sistema contable y perdi\xF3 los par\xE1metros de su pol\xEDtica de pedidos. Solo conserva las facturas de tres pedidos de prueba con su costo anual total. Adem\xE1s, la demanda del pr\xF3ximo a\xF1o es incierta y el proveedor propone un descuento por volumen.",info:["Costo anual observado con distintos tama\xF1os de pedido: Q = 600 \u2192 6.000; Q = 1.200 \u2192 4.800; Q = 2.400 \u2192 6.000 (miles de pesos).","Se sabe que el costo anual tiene la forma C(Q) = a/Q + b\xB7Q.","Demanda anual estimada: entre 10.000 y 14.000 unidades; la mejor estimaci\xF3n es 12.000.","El proveedor ofrece 3 % de descuento sobre el precio de compra (50 mil pesos por unidad) en pedidos de 1.500 unidades o m\xE1s."],restrictions:["Bodega ampliada: 6 m\xF3dulos, capacidad 1.500 unidades.","Cifras en miles de pesos y simuladas con fines formativos."],decision:"\xBFQu\xE9 pedido recomiendas con datos incompletos y demanda incierta, y conviene aceptar el descuento?"}),{...lh,questions:[{q:"Tienes un modelo C(Q) = a/Q + b\xB7Q con dos par\xE1metros desconocidos. \xBFC\xF3mo comprobar que el modelo ajustado es correcto?",opts:[lt("Evaluarlo en todos los datos observados y comparar","Correcto: si falla en un dato, el modelo o los par\xE1metros est\xE1n mal."),Pe("Verificar que la gr\xE1fica se vea parecida","Una gr\xE1fica parecida no garantiza valores correctos."),Pe("Verificar que a y b sean positivos","Es necesario pero no suficiente.")]},{q:"Si el \xF3ptimo Q* depende de un par\xE1metro incierto, \xBFqu\xE9 herramienta de c\xE1lculo mide cu\xE1nto cambia Q* cuando el par\xE1metro cambia?",opts:[lt("La derivada de Q* respecto del par\xE1metro","Correcto: es un an\xE1lisis de sensibilidad."),Pe("La integral de Q*","La integral acumula; aqu\xED buscas una tasa de cambio."),Pe("El promedio de Q*","No mide sensibilidad.")]},{q:"Un descuento que solo aplica desde cierto volumen introduce un salto en el costo total. \xBFQu\xE9 implica para el m\xE9todo de C\u2032(Q) = 0?",opts:[lt("No basta: hay que comparar el costo total de cada candidato","Correcto: en un salto la derivada no existe."),Pe("Nada: sigue funcionando igual","La funci\xF3n deja de ser continua."),Pe("Que el descuento nunca conviene","Puede convenir mucho; se verifica con cifras.")]}],bridge:"Ahora no te dan el modelo: lo construyes desde los datos, tratas la incertidumbre con derivadas y comparas candidatos cuando la funci\xF3n presenta un salto."},{type:"build",phase:2,title:"Arma la bodega ampliada",icon:"\u{1F3D7}\uFE0F",ped:"Reconstruir el espacio para operar con capacidad suficiente.",mat:"Capacidad = 6 \xD7 250 = 1.500 unidades.",task:"Coloca 1 muelle de recibo y 6 m\xF3dulos de estanter\xEDa.",need:{anden:1,estanteria:6}},{type:"expr",phase:2,title:"Reconstruye el modelo desde los datos",icon:"\u{1F9EE}",ped:"Modelar desde evidencia emp\xEDrica: el modelo debe reproducir todos los
